<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Animated terminal compression demo">
  <rect width="900" height="330" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Window Title Bar -->
  <rect width="900" height="36" rx="14" fill="#161b22"/>
  <rect y="20" width="900" height="16" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    JBSI Compressor CLI — Jaspreet Bhatia
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <!-- Prompt -->
    <text x="24" y="68" fill="#3fb950">$</text>
    <text x="40" y="68" fill="#e6edf3">python main.py ./media -p medium -f avif</text>
    <!-- Blinking cursor -->
    <rect x="372" y="55" width="8" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Progress bar line -->
    <text x="24" y="100" fill="#58a6ff" opacity="0">
      Compressing 5 files...
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="215" y="90" width="320" height="10" rx="5" fill="#21262d" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="215" y="90" width="0" height="10" rx="5" fill="#2ea043">
      <animate attributeName="width" values="0;320;320" keyTimes="0.14;0.45;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="548" y="100" fill="#8b949e" opacity="0">
      5/5
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.44;1" dur="6s" repeatCount="indefinite"/>
    </text>

    <!-- Table Header -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.55;1" dur="6s" repeatCount="indefinite"/>
      <rect x="24" y="122" width="852" height="26" rx="4" fill="#1f6feb"/>
      <text x="36" y="140" fill="#ffffff" font-weight="700">File</text>
      <text x="260" y="140" fill="#ffffff" font-weight="700">Original</text>
      <text x="390" y="140" fill="#ffffff" font-weight="700">Compressed</text>
      <text x="530" y="140" fill="#ffffff" font-weight="700">Saved</text>
      <text x="720" y="140" fill="#ffffff" font-weight="700">Engine</text>

      <!-- Row 1 -->
      <text x="36" y="170" fill="#79c0ff">report.pdf</text>
      <text x="260" y="170" fill="#e6edf3">12.40 MB</text>
      <text x="390" y="170" fill="#e6edf3">2.15 MB</text>
      <text x="530" y="170" fill="#3fb950">10.25 MB (-82.7%)</text>
      <text x="720" y="170" fill="#8b949e">ghostscript (/ebook)</text>

      <!-- Row 2 -->
      <text x="36" y="196" fill="#79c0ff">photo.heic</text>
      <text x="260" y="196" fill="#e6edf3">4.80 MB</text>
      <text x="390" y="196" fill="#e6edf3">410.00 KB</text>
      <text x="530" y="196" fill="#3fb950">4.40 MB (-91.7%)</text>
      <text x="720" y="196" fill="#8b949e">pillow/avif</text>

      <!-- Row 3 -->
      <text x="36" y="222" fill="#79c0ff">slides.pptx</text>
      <text x="260" y="222" fill="#e6edf3">18.20 MB</text>
      <text x="390" y="222" fill="#e6edf3">4.90 MB</text>
      <text x="530" y="222" fill="#3fb950">13.30 MB (-73.1%)</text>
      <text x="720" y="222" fill="#8b949e">office-zip (14 img)</text>

      <!-- Row 4 -->
      <text x="36" y="248" fill="#79c0ff">icon.svg</text>
      <text x="260" y="248" fill="#e6edf3">94.00 KB</text>
      <text x="390" y="248" fill="#e6edf3">28.40 KB</text>
      <text x="530" y="248" fill="#3fb950">65.60 KB (-69.8%)</text>
      <text x="720" y="248" fill="#8b949e">scour/medium</text>

      <!-- Row 5 -->
      <text x="36" y="274" fill="#79c0ff">Inter.ttf</text>
      <text x="260" y="274" fill="#e6edf3">412.00 KB</text>
      <text x="390" y="274" fill="#e6edf3">128.00 KB</text>
      <text x="530" y="274" fill="#3fb950">284.00 KB (-68.9%)</text>
      <text x="720" y="274" fill="#8b949e">fonttools/woff2</text>

      <!-- Summary Footer -->
      <text x="24" y="308" fill="#3fb950" font-weight="700">Done:</text>
      <text x="72" y="308" fill="#e6edf3">5 item(s) | 35.90 MB -&gt; 7.61 MB (28.29 MB saved, 78.8%)</text>
    </g>
  </g>
</svg>

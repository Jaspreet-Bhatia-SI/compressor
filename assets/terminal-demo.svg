<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Real CLI session recording of JBSI Compressor">
  <rect width="920" height="360" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Window Title Bar -->
  <rect width="920" height="36" rx="14" fill="#161b22"/>
  <rect y="20" width="920" height="16" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="460" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    JBSI File Compressor &amp; Format Converter — Real CLI Session (Jaspreet Bhatia)
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <!-- Real CLI command -->
    <text x="24" y="66" fill="#3fb950">$</text>
    <text x="40" y="66" fill="#e6edf3">python main.py ./media -p medium -o ./out</text>
    <rect x="358" y="53" width="8" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Progress line captured from Rich progress bar -->
    <text x="24" y="96" fill="#58a6ff" opacity="0">
      Compressing voice.wav
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="6.5s" repeatCount="indefinite"/>
    </text>
    <rect x="195" y="86" width="330" height="10" rx="5" fill="#21262d" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="195" y="86" width="0" height="10" rx="5" fill="#d946ef">
      <animate attributeName="width" values="0;330;330" keyTimes="0.12;0.42;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <text x="536" y="96" fill="#8b949e" opacity="0">
      6/6
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.41;1" dur="6.5s" repeatCount="indefinite"/>
    </text>

    <!-- Authentic Compression Summary Table -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.52;1" dur="6.5s" repeatCount="indefinite"/>
      <text x="460" y="124" text-anchor="middle" fill="#e6edf3" font-weight="700">Compression Summary</text>
      <rect x="24" y="132" width="872" height="24" rx="4" fill="#1f6feb"/>
      <text x="36" y="149" fill="#ffffff" font-weight="700">File</text>
      <text x="175" y="149" fill="#ffffff" font-weight="700">Original</text>
      <text x="295" y="149" fill="#ffffff" font-weight="700">Compressed</text>
      <text x="430" y="149" fill="#ffffff" font-weight="700">Saved</text>
      <text x="640" y="149" fill="#ffffff" font-weight="700">Engine</text>

      <!-- Row 1: font.ttf -->
      <text x="36" y="178" fill="#79c0ff">font.ttf</text>
      <text x="175" y="178" fill="#e6edf3">5.95 MB</text>
      <text x="295" y="178" fill="#e6edf3">2.91 MB</text>
      <text x="430" y="178" fill="#3fb950">3.03 MB (-51.0%)</text>
      <text x="640" y="178" fill="#8b949e">fonttools/woff2</text>

      <!-- Row 2: logo.svg -->
      <text x="36" y="202" fill="#79c0ff">logo.svg</text>
      <text x="175" y="202" fill="#e6edf3">367 B</text>
      <text x="295" y="202" fill="#e6edf3">166 B</text>
      <text x="430" y="202" fill="#3fb950">201 B (-54.8%)</text>
      <text x="640" y="202" fill="#8b949e">scour/medium</text>

      <!-- Row 3: photo.heic -->
      <text x="36" y="226" fill="#79c0ff">photo.heic</text>
      <text x="175" y="226" fill="#e6edf3">505.08 KB</text>
      <text x="295" y="226" fill="#e6edf3">396.33 KB</text>
      <text x="430" y="226" fill="#3fb950">108.75 KB (-21.5%)</text>
      <text x="640" y="226" fill="#8b949e">pillow/heic</text>

      <!-- Row 4: report.pdf -->
      <text x="36" y="250" fill="#79c0ff">report.pdf</text>
      <text x="175" y="250" fill="#e6edf3">1.00 MB</text>
      <text x="295" y="250" fill="#e6edf3">172.31 KB</text>
      <text x="430" y="250" fill="#3fb950">856.58 KB (-83.3%)</text>
      <text x="640" y="250" fill="#8b949e">ghostscript (/ebook, 150dpi)</text>

      <!-- Row 5: slides.pptx (Size-Guard Demo) -->
      <text x="36" y="274" fill="#79c0ff">slides.pptx</text>
      <text x="175" y="274" fill="#e6edf3">1.00 MB</text>
      <text x="295" y="274" fill="#e6edf3">1.00 MB</text>
      <text x="430" y="274" fill="#d29922">kept original</text>
      <text x="640" y="274" fill="#8b949e">kept original (already optimal)</text>

      <!-- Row 6: voice.wav -->
      <text x="36" y="298" fill="#79c0ff">voice.wav</text>
      <text x="175" y="298" fill="#e6edf3">86.18 KB</text>
      <text x="295" y="298" fill="#e6edf3">32.69 KB</text>
      <text x="430" y="298" fill="#3fb950">53.48 KB (-62.1%)</text>
      <text x="640" y="298" fill="#8b949e">ffmpeg/libmp3lame (128kbps)</text>

      <!-- Real Summary Footer -->
      <text x="24" y="334" fill="#3fb950" font-weight="700">Done:</text>
      <text x="68" y="334" fill="#e6edf3">6 item(s) | 8.53 MB -&gt; 4.50 MB (4.03 MB saved, 47.2%)</text>
    </g>
  </g>
</svg>

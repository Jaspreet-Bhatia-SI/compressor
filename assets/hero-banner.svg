<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Universal CLI Compressor animated banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#111a36"/>
      <stop offset="100%" stop-color="#0d1328"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="256" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Subtle animated grid pulse -->
  <g stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="195" x2="900" y2="195"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="720" y1="0" x2="720" y2="260"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="48" y="76" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    All-in-One CLI Compressor
  </text>
  <text x="48" y="108" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    PDF  •  IMAGE (AVIF / HEIC / GIF)  •  VIDEO  •  AUDIO  •  SVG  •  OFFICE  •  FONTS  •  ARCHIVES
  </text>

  <!-- Animated Compression Flow Pills on the left -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="48" y="138" width="110" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="103" y="158" text-anchor="middle" fill="#e2e8f0">RAW MEDIA</text>

    <!-- Animated pulse arrow 1 -->
    <line x1="168" y1="154" x2="218" y2="154" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <polygon points="218,149 228,154 218,159" fill="#38bdf8"/>

    <rect x="236" y="138" width="142" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.8"/>
    <text x="307" y="158" text-anchor="middle" fill="#c7d2fe">SMART ENGINE</text>

    <!-- Animated pulse arrow 2 -->
    <line x1="388" y1="154" x2="438" y2="154" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <polygon points="438,149 448,154 438,159" fill="#34d399"/>

    <rect x="456" y="138" width="128" height="32" rx="8" fill="#064e3b" stroke="#34d399" stroke-opacity="0.8"/>
    <text x="520" y="158" text-anchor="middle" fill="#a7f3d0">TINY + SAFE</text>
  </g>

  <!-- Animated Compression Gauge Cards (Right Side) -->
  <g transform="translate(615, 50)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="242" height="162" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="700">LIVE SHRINK PREVIEW</text>

    <!-- Bar 1: PDF -->
    <text x="16" y="52" fill="#e2e8f0" font-size="11">PDF</text>
    <text x="226" y="52" text-anchor="end" fill="#34d399" font-size="11">-78%</text>
    <rect x="16" y="58" width="210" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="58" width="210" height="8" rx="4" fill="url(#barGrad)">
      <animate attributeName="width" values="210;46;46;210" keyTimes="0;0.45;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 2: HEIC -> AVIF -->
    <text x="16" y="88" fill="#e2e8f0" font-size="11">AVIF</text>
    <text x="226" y="88" text-anchor="end" fill="#34d399" font-size="11">-84%</text>
    <rect x="16" y="94" width="210" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="94" width="210" height="8" rx="4" fill="url(#barGrad)">
      <animate attributeName="width" values="210;34;34;210" keyTimes="0;0.45;0.85;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 3: PPTX / ZIP -->
    <text x="16" y="124" fill="#e2e8f0" font-size="11">PPTX</text>
    <text x="226" y="124" text-anchor="end" fill="#34d399" font-size="11">-72%</text>
    <rect x="16" y="130" width="210" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="130" width="210" height="8" rx="4" fill="url(#barGrad)">
      <animate attributeName="width" values="210;58;58;210" keyTimes="0;0.45;0.85;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom status strip -->
  <text x="48" y="218" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    ✓ Target-size auto solver (-t 500KB)   ✓ Atomic size-guard (never bloats)   ✓ Interactive &amp; Batch CLI
  </text>
</svg>
